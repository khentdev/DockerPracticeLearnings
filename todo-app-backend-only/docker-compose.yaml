
services:
  postgres_db:
    image: postgres:18.1
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=prisma
    ports:
      - "5432:5432"
    networks:
      - prisma-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql
    command: postgres -c listen_addresses='*'
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:prisma@postgres_db:5432/postgres?schema=public"
    env_file:
      - .env
    networks:
      - prisma-network
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - .git/
            - generated/
            - .env
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./Dockerfile
networks:
  prisma-network:
    name: prisma-network

volumes:
  postgres_data:
